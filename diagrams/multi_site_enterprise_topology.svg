<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs>
  <style>
    .title{font:700 32px Arial,sans-serif;fill:#fff}
    .subtitle{font:700 21px Arial,sans-serif;fill:#102a43}
    .label{font:700 17px Arial,sans-serif;fill:#102a43}
    .text{font:15px Arial,sans-serif;fill:#243b53}
    .small{font:13px Arial,sans-serif;fill:#243b53}
    .box{stroke-width:2}
    .device{fill:#fff;stroke:#244a6b;stroke-width:2}
    .wan{stroke:#bd3b35;stroke-width:4;fill:none}
    .lan{stroke:#243b53;stroke-width:3;fill:none}
    .gre{stroke:#7b2cbf;stroke-width:4;stroke-dasharray:12 8;fill:none}
    .tablehead{font:700 15px Arial,sans-serif;fill:#fff}
    .tabletext{font:14px Arial,sans-serif;fill:#243b53}
  </style>
</defs>
<rect width="1600" height="1050" fill="#ffffff"/>
<rect x="230" y="20" width="1140" height="68" rx="14" fill="#123b5d"/>
<text x="800" y="63" text-anchor="middle" class="title">Multi-Site Enterprise Network — Topology</text>
<text x="800" y="119" text-anchor="middle" class="text">Cisco Packet Tracer | OSPF • VLANs • DHCP/DNS • NAT/PAT • ACLs • GRE</text>

<!-- site panels -->
<rect x="30" y="155" width="660" height="570" rx="18" fill="#eef7ff" stroke="#4c9bd6" class="box"/>
<text x="360" y="190" text-anchor="middle" class="subtitle">HEADQUARTERS (HQ)</text>
<rect x="725" y="185" width="320" height="360" rx="18" fill="#f5f3ff" stroke="#9270c7" class="box"/>
<text x="885" y="220" text-anchor="middle" class="subtitle">ISP NETWORK</text>
<rect x="1080" y="300" width="490" height="425" rx="18" fill="#effaf0" stroke="#54a56a" class="box"/>
<text x="1325" y="335" text-anchor="middle" class="subtitle">BRANCH OFFICE</text>

<!-- HQ router, ISP router, branch router -->
<rect x="270" y="245" width="180" height="78" rx="14" class="device"/>
<text x="360" y="276" text-anchor="middle" class="label">HQ-R1</text>
<text x="360" y="300" text-anchor="middle" class="small">2911 Router</text>
<rect x="795" y="270" width="180" height="78" rx="14" class="device"/>
<text x="885" y="301" text-anchor="middle" class="label">ISP-R1</text>
<text x="885" y="325" text-anchor="middle" class="small">2911 Router</text>
<rect x="1185" y="385" width="180" height="78" rx="14" class="device"/>
<text x="1275" y="416" text-anchor="middle" class="label">BR-R1</text>
<text x="1275" y="440" text-anchor="middle" class="small">2911 Router</text>

<!-- WAN links -->
<path d="M450 267 L795 305" class="wan"/>
<text x="618" y="260" text-anchor="middle" class="label">HQ–ISP WAN</text>
<text x="618" y="282" text-anchor="middle" class="text">10.255.0.0/30</text>
<text x="480" y="294" class="small">HQ: .1</text>
<text x="730" y="299" class="small">ISP: .2</text>

<path d="M975 320 L1185 410" class="wan"/>
<text x="1075" y="354" text-anchor="middle" class="label">ISP–Branch WAN</text>
<text x="1075" y="375" text-anchor="middle" class="text">10.255.0.4/30</text>
<text x="1000" y="326" class="small">ISP: .5</text>
<text x="1133" y="399" class="small">Branch: .6</text>

<!-- GRE overlay -->
<path d="M400 245 C540 155, 1070 170, 1270 385" class="gre"/>
<rect x="650" y="151" width="260" height="40" rx="8" fill="#fff" stroke="#7b2cbf" stroke-width="1.5"/>
<text x="780" y="177" text-anchor="middle" class="label" style="fill:#7b2cbf">GRE Tunnel: 10.255.0.8/30</text>
<text x="460" y="224" class="small">HQ: 10.255.0.9</text>
<text x="1160" y="365" class="small">Branch: 10.255.0.10</text>

<!-- HQ router to switch -->
<path d="M360 323 L360 385" class="lan"/>
<text x="378" y="357" class="small">G0/1 trunk</text>
<rect x="275" y="385" width="170" height="62" rx="10" class="device"/>
<text x="360" y="411" text-anchor="middle" class="label">HQ-SW1</text>
<text x="360" y="432" text-anchor="middle" class="small">2960 • VLAN access</text>

<!-- VLAN boxes -->
<rect x="55" y="490" width="145" height="118" rx="10" fill="#dceeff" stroke="#4c9bd6" stroke-width="1.5"/>
<text x="127" y="518" text-anchor="middle" class="label">VLAN 10</text>
<text x="127" y="541" text-anchor="middle" class="text">IT</text>
<text x="127" y="563" text-anchor="middle" class="small">10.10.10.0/24</text>
<text x="127" y="585" text-anchor="middle" class="small">GW .1</text>

<rect x="215" y="490" width="145" height="118" rx="10" fill="#e1f6e6" stroke="#54a56a" stroke-width="1.5"/>
<text x="287" y="518" text-anchor="middle" class="label">VLAN 20</text>
<text x="287" y="541" text-anchor="middle" class="text">Sales</text>
<text x="287" y="563" text-anchor="middle" class="small">10.10.20.0/24</text>
<text x="287" y="585" text-anchor="middle" class="small">GW .1</text>

<rect x="375" y="490" width="145" height="118" rx="10" fill="#fff0cc" stroke="#d5a22c" stroke-width="1.5"/>
<text x="447" y="518" text-anchor="middle" class="label">VLAN 30</text>
<text x="447" y="541" text-anchor="middle" class="text">Management</text>
<text x="447" y="563" text-anchor="middle" class="small">10.10.30.0/24</text>
<text x="447" y="585" text-anchor="middle" class="small">GW .1</text>

<rect x="535" y="490" width="130" height="118" rx="10" fill="#ffe2e2" stroke="#cf6060" stroke-width="1.5"/>
<text x="600" y="518" text-anchor="middle" class="label">VLAN 40</text>
<text x="600" y="541" text-anchor="middle" class="text">Guest</text>
<text x="600" y="563" text-anchor="middle" class="small">10.10.40.0/24</text>
<text x="600" y="585" text-anchor="middle" class="small">GW .1</text>
<path d="M360 447 L360 468 L127 468 L127 490 M360 468 L287 468 L287 490 M360 468 L447 468 L447 490 M360 468 L600 468 L600 490" class="lan"/>

<!-- HQ server -->
<rect x="485" y="270" width="160" height="90" rx="10" class="device"/>
<text x="565" y="298" text-anchor="middle" class="label">HQ-SRV1</text>
<text x="565" y="320" text-anchor="middle" class="small">DHCP + DNS</text>
<text x="565" y="342" text-anchor="middle" class="small">10.10.30.100</text>
<path d="M445 416 L465 416 L465 315 L485 315" class="lan"/>
<text x="467" y="405" class="small">Server access</text>

<!-- Branch switch, LAN, clients -->
<path d="M1275 463 L1275 500" class="lan"/>
<text x="1292" y="486" class="small">G0/1</text>
<rect x="1190" y="500" width="170" height="62" rx="10" class="device"/>
<text x="1275" y="526" text-anchor="middle" class="label">BR-SW1</text>
<text x="1275" y="547" text-anchor="middle" class="small">2960 Switch</text>
<path d="M1275 562 L1275 588 L1165 588 L1165 605 M1275 588 L1275 605 M1275 588 L1385 588 L1385 605" class="lan"/>
<rect x="1110" y="605" width="110" height="55" rx="8" class="device"/>
<text x="1165" y="628" text-anchor="middle" class="label">PC1</text>
<text x="1165" y="648" text-anchor="middle" class="small">Branch user</text>
<rect x="1220" y="605" width="110" height="55" rx="8" class="device"/>
<text x="1275" y="628" text-anchor="middle" class="label">PC2</text>
<text x="1275" y="648" text-anchor="middle" class="small">Branch user</text>
<rect x="1330" y="605" width="110" height="55" rx="8" class="device"/>
<text x="1385" y="628" text-anchor="middle" class="label">Branch LAN</text>
<text x="1385" y="648" text-anchor="middle" class="small">10.20.10.0/24</text>
<text x="1325" y="690" text-anchor="middle" class="text">Gateway: 10.20.10.1</text>
<text x="1325" y="710" text-anchor="middle" class="small">Switch management: 10.20.10.2</text>

<!-- external server -->
<rect x="810" y="415" width="150" height="88" rx="10" class="device"/>
<text x="885" y="443" text-anchor="middle" class="label">EXT-SRV1</text>
<text x="885" y="465" text-anchor="middle" class="small">Simulated Internet</text>
<text x="885" y="487" text-anchor="middle" class="small">203.0.113.10</text>
<path d="M885 348 L885 415" class="lan"/>
<text x="900" y="385" class="small">G0/2: 203.0.113.1/24</text>

<!-- tables -->
<rect x="30" y="755" width="500" height="245" rx="12" fill="#fff" stroke="#4c9bd6" stroke-width="1.5"/>
<rect x="30" y="755" width="500" height="38" rx="12" fill="#123b5d"/>
<text x="280" y="780" text-anchor="middle" class="tablehead">ADDRESSING SUMMARY</text>
<g class="tabletext">
<text x="48" y="820">HQ IT VLAN 10</text><text x="280" y="820">10.10.10.0/24 • GW 10.10.10.1</text>
<text x="48" y="847">HQ Sales VLAN 20</text><text x="280" y="847">10.10.20.0/24 • GW 10.10.20.1</text>
<text x="48" y="874">HQ Mgmt VLAN 30</text><text x="280" y="874">10.10.30.0/24 • GW 10.10.30.1</text>
<text x="48" y="901">HQ Guest VLAN 40</text><text x="280" y="901">10.10.40.0/24 • GW 10.10.40.1</text>
<text x="48" y="928">Branch LAN</text><text x="280" y="928">10.20.10.0/24 • GW 10.20.10.1</text>
<text x="48" y="955">HQ–ISP WAN</text><text x="280" y="955">10.255.0.0/30</text>
<text x="48" y="982">ISP–Branch WAN</text><text x="280" y="982">10.255.0.4/30</text>
</g>

<rect x="550" y="755" width="500" height="245" rx="12" fill="#fff" stroke="#9270c7" stroke-width="1.5"/>
<rect x="550" y="755" width="500" height="38" rx="12" fill="#123b5d"/>
<text x="800" y="780" text-anchor="middle" class="tablehead">ROUTING &amp; SERVICES</text>
<g class="tabletext">
<text x="575" y="824">• OSPF process 1, area 0 on HQ-R1, ISP-R1, BR-R1</text>
<text x="575" y="856">• DHCP scopes hosted on HQ-SRV1; relay helpers configured</text>
<text x="575" y="888">• DNS record: hq-srv1.enterprise.local → 10.10.30.100</text>
<text x="575" y="920">• NAT/PAT configured on ISP-R1 toward 203.0.113.0/24</text>
<text x="575" y="952">• Guest ACL restricts internal access; SSH management enabled</text>
<text x="575" y="984">• GRE is a tunnel overlay, not encryption; LAN routes not tunneled</text>
</g>

<rect x="1070" y="755" width="500" height="245" rx="12" fill="#fff" stroke="#54a56a" stroke-width="1.5"/>
<rect x="1070" y="755" width="500" height="38" rx="12" fill="#123b5d"/>
<text x="1320" y="780" text-anchor="middle" class="tablehead">LINK LEGEND &amp; NOTES</text>
<path d="M1100 825 L1170 825" class="wan"/><text x="1190" y="831" class="tabletext">WAN links (routed point-to-point)</text>
<path d="M1100 860 L1170 860" class="lan"/><text x="1190" y="866" class="tabletext">LAN / Ethernet connections</text>
<path d="M1100 895 L1170 895" class="gre"/><text x="1190" y="901" class="tabletext">GRE tunnel overlay</text>
<text x="1100" y="936" class="tabletext">External subnet: 203.0.113.0/24</text>
<text x="1100" y="962" class="tabletext">ISP outside interface: 203.0.113.1</text>
<text x="1100" y="988" class="tabletext">Topology reflects project addressing plan.</text>
</svg>